[build-system]
requires = ["setuptools>=77", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjet3d"
version = "0.3.0"
description = "A tiny, dependency-free 3D software rasteriser for Python (powered by CubeCoders/Jet)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "TestyLemonad" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[tool.cibuildwheel]
build-verbosity = 1
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
