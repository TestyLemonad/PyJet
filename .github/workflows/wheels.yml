name: Build and publish PyJet to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Позволяет запускать воркфлоу вручную из вкладки Actions!

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          # Build every supported CPython version explicitly.  This avoids
          # accidentally picking up free-threaded or pre-release identifiers.
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          # Skip PyPy and 32-bit builds.
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_i686"
          # Для macOS собираем и x86_64, и arm64 (опционально, раскомментируй при необходимости)
          # CIBW_ARCHS_MACOS: "x86_64 arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  test_sdist:
    name: Build and test source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install sdist
        run: |
          python -m pip install --upgrade build pytest
          python -m build --sdist
          python -m pip install dist/*.tar.gz

      - name: Run Python tests against installed sdist
        run: pytest tests

  publish:
    needs: [build_wheels, test_sdist]
    runs-on: ubuntu-latest
    # Публикуем на PyPI только если это был запуск по тегу v*
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibuildwheel-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
